name: Release desktop builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release version
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(jq -r '.version' frontend/src-tauri/tauri.conf.json)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - name: Build Linux bundles
        working-directory: frontend
        run: |
          npm ci
          npm run tauri:build

      - name: Create Linux checksums
        run: |
          find frontend/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 | xargs -0 sha256sum > linux-SHA256SUMS.txt
      - name: Attest Linux installers
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Store Linux installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-installers
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            linux-SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-installers
          path: installers

      - name: Upload Linux installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          release_commit="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq '.sha')"
          test "$release_commit" = "$BUILD_COMMIT"
          gh release upload --clobber "$TAG" installers/frontend/src-tauri/target/release/bundle/deb/*.deb installers/frontend/src-tauri/target/release/bundle/appimage/*.AppImage installers/linux-SHA256SUMS.txt
          gh release edit "$TAG" --notes-start "Built from commit $BUILD_COMMIT. Checksums and build attestations are included."

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify release version and commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(jq -r '.version' frontend/src-tauri/tauri.conf.json)"
          git rev-parse HEAD > build-commit.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build macOS bundle
        working-directory: frontend
        run: |
          npm ci
          npm run tauri:build -- --target ${{ matrix.target }}
      - name: Attest macOS installers
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - name: Create macOS checksums
        run: shasum -a 256 frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > macos-${{ matrix.target }}-SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build-commit.txt
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            macos-${{ matrix.target }}-SHA256SUMS.txt

  publish-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-${{ matrix.target }}
          path: installers
      - name: Upload macOS installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_commit="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq '.sha')"
          test "$release_commit" = "$(cat installers/build-commit.txt)"
          gh release upload --clobber "$TAG" installers/frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg installers/macos-${{ matrix.target }}-SHA256SUMS.txt

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag" }
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify release version and commit
        env:
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $config = Get-Content frontend/src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($env:TAG -ne "v$($config.version)") { throw "Tag and application version differ" }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build-commit.txt'), (git rev-parse HEAD), [System.Text.Encoding]::ASCII)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
      - name: Build Windows bundles
        working-directory: frontend
        run: |
          npm ci
          npm run tauri:build
      - name: Attest Windows installers
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
      - name: Create Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem frontend/src-tauri/target/release/bundle/msi/*.msi,frontend/src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path)" } | Set-Content windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            build-commit.txt
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            windows-SHA256SUMS.txt

  publish-windows:
    needs: build-windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installers
          path: installers
      - name: Upload Windows installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_commit="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq '.sha')"
          test "$release_commit" = "$(cat installers/build-commit.txt)"
          gh release upload --clobber "$TAG" installers/frontend/src-tauri/target/release/bundle/msi/*.msi installers/frontend/src-tauri/target/release/bundle/nsis/*.exe installers/windows-SHA256SUMS.txt
