name: Build Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release version
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(jq -r '.version' frontend/src-tauri/tauri.conf.json)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - name: Build Linux bundles
        working-directory: frontend
        run: |
          npm ci
          npm run tauri:build

      - name: Store Linux installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-installers
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-installers
          path: installers

      - name: Upload Linux installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          release_commit="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq '.sha')"
          test "$release_commit" = "$BUILD_COMMIT"
          gh release upload "$TAG" installers/deb/*.deb installers/appimage/*.AppImage

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify release version and commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(jq -r '.version' frontend/src-tauri/tauri.conf.json)"
          git rev-parse HEAD > build-commit.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build macOS bundle
        working-directory: frontend
        run: |
          npm ci
          npm run tauri:build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build-commit.txt
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  publish-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-${{ matrix.target }}
          path: installers
      - name: Upload macOS installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_commit="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq '.sha')"
          test "$release_commit" = "$(cat installers/build-commit.txt)"
          gh release upload "$TAG" installers/frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
