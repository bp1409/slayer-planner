name: Deploy web version

on:
  push:
    tags: ["v*.*.*"]
    branches: [dev]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'main' }}
          path: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: dev
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/frontend/package-lock.json
            dev/frontend/package-lock.json
      - run: npm ci
        working-directory: main/frontend
      - run: npm test
        working-directory: main/frontend
      - run: npm run build
        working-directory: main/frontend
        env:
          PAGES_BASE: "/slayer-planner/"
      - run: npm ci
        working-directory: dev/frontend
      - run: npm test
        working-directory: dev/frontend
      - run: npm run build
        working-directory: dev/frontend
        env:
          PAGES_BASE: "/slayer-planner/dev/"
      - name: Add dev preview to Pages artifact
        run: |
          rm -rf main/frontend/dist/dev
          mkdir -p main/frontend/dist/dev
          cp -R dev/frontend/dist/. main/frontend/dist/dev/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: main/frontend/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
